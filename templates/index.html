<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSpeed Tracker - Track your Internet Speed</title>
    <link rel="shortcut icon" href="https://www.shutterstock.com/shutterstock/photos/1018327852/display_1500/stock-vector-the-tachometer-speedometer-and-indicator-icon-speed-sign-logo-vector-1018327852.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script async src="https://kit.fontawesome.com/01187779a7.js" crossorigin="anonymous"></script>
    <script async src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>
    <div class="body">
        <div class="content">
            <main class="main" id="main">
                <h1 class="main-title">NetSpeed Tracker</h1>
                <p class="main-desc">Track your Internet Speed and view your speed test history.</p>
                <div id="results">
                    <!-- Content dynamically generated from script.js -->
                </div>
                <button class="button" onclick="runSpeedTest()">
                    <span class="spinner"></span> <p class="button-text">Check Speed</p>
                </button>
                
                <h2 id="history-title">Speed Test History</h2>
                <ul class="history-list">
                    <!-- Content dynamically generated from script.js -->
                </ul>

                <p class="footer-text">Project is Open source. View codebase on <i class="fa-brands fa-github"></i> Github Repository <a href="https://github.com/realitystevens/NetSpeed-Tracker">here</a></p>
            </main>
        </div>
    </div>
</body>
</html>
